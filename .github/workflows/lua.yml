name: Lua checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lua-54:
    name: Lua 5.4 tests and syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"

      - name: Run tests
        run: lua tests/run.lua

      - name: Check Lua syntax
        run: find . -type f -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -r -n1 luac -p
